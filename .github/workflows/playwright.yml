name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      USE_MOCK_DALLE: "true"
      # Throwaway database owned by this job (see `services.postgres`), so E2E
      # never depends on, or writes to, a hosted database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixel_studio_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pixel_studio_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixel_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Create .env file
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "DIRECT_URL=$DIRECT_URL" >> .env
          echo "SESSION_SECRET=e2e-test-session-secret" >> .env
          echo "USE_MOCK_DALLE=true" >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Start Server
        run: npm run dev & npx wait-on http://localhost:5173

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          USE_MOCK_DALLE: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
